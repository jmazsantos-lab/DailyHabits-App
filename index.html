<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <title>Órbita</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#F2F4F7" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#090C12" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Órbita" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="icon" type="image/svg+xml" href="logo.svg" />
  <link rel="stylesheet" href="styles.css?v=4.2" />
  <style>
    /* Animación de apertura «Trazo» (1 s): los seis arcos aparecen uno tras otro girando hasta su sitio,
       después el check y el nombre; a los 0,82 s todo se funde con la app. */
    #splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
      background:var(--bg,#F2F4F7);color:var(--fg,#101521);animation:spl-out .18s ease-in .82s forwards}
    #splash .orb{width:132px;height:132px;overflow:visible}
    #splash .arc,#splash .chk{transform-box:fill-box;transform-origin:center;opacity:0}
    #splash .arc{animation:spl-in .26s cubic-bezier(.2,.8,.2,1) forwards}
    #splash .a1{animation-delay:.07s}#splash .a2{animation-delay:.14s}#splash .a3{animation-delay:.21s}#splash .a4{animation-delay:.28s}#splash .a5{animation-delay:.35s}
    #splash .chk{animation:spl-pop .22s ease-out .5s forwards}
    #splash .name{font:800 30px/1 ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,sans-serif;letter-spacing:-.01em;opacity:0;transform:translateY(6px);animation:spl-name .25s ease-out .42s forwards}
    @keyframes spl-in{from{opacity:0;transform:scale(.3) rotate(-25deg)}to{opacity:1;transform:none}}
    @keyframes spl-pop{from{opacity:0;transform:scale(.35)}to{opacity:1;transform:none}}
    @keyframes spl-name{to{opacity:1;transform:none}}
    @keyframes spl-out{to{opacity:0;visibility:hidden}}
    @media (prefers-reduced-motion:reduce){#splash{display:none}}
  </style>
</head>
<body>
  <div id="splash" aria-hidden="true">
    <svg class="orb" viewBox="0 0 1024 1024" aria-hidden="true">
      <g><path class="arc a0" d="M424.3 225.1A300 300 0 0 1 599.7 225.1" stroke="#8B5CF6" stroke-width="96" stroke-linecap="round" fill="none"/>
      <path class="arc a1" d="M716.6 292.6A300 300 0 0 1 804.3 444.5" stroke="#10B981" stroke-width="96" stroke-linecap="round" fill="none"/>
      <path class="arc a2" d="M804.3 579.5A300 300 0 0 1 716.6 731.4" stroke="#EC4899" stroke-width="96" stroke-linecap="round" fill="none"/>
      <path class="arc a3" d="M599.7 798.9A300 300 0 0 1 424.3 798.9" stroke="#F59E0B" stroke-width="96" stroke-linecap="round" fill="none"/>
      <path class="arc a4" d="M307.4 731.4A300 300 0 0 1 219.7 579.5" stroke="#3B82F6" stroke-width="96" stroke-linecap="round" fill="none"/>
      <path class="arc a5" d="M219.7 444.5A300 300 0 0 1 307.4 292.6" stroke="#14B8A6" stroke-width="96" stroke-linecap="round" fill="none"/></g>
      <path class="chk" d="M404 520L480 596L632 440" stroke="currentColor" stroke-width="80" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </svg>
    <div class="name">Órbita</div>
  </div>
  <script>setTimeout(function () { var s = document.getElementById('splash'); if (s) s.remove(); }, 1000);</script>
  <div class="shell">
    <nav class="tabbar" id="tabbar" aria-label="Secciones"></nav>
    <main class="main" id="main"></main>
  </div>
  <div id="layer"></div>

  <!-- Aviso de emergencia independiente del resto de archivos -->
  <script>
    setTimeout(function () {
      var m = document.getElementById('main');
      if (m && m.children.length === 0) {
        m.innerHTML = '<div style="margin:24px 0;padding:16px;border-radius:14px;background:#FDECEC;color:#8A1C1C;font:14px -apple-system,sans-serif">' +
          '<b>La app no terminó de cargar.</b><br><br>Cierra la app por completo y vuelve a abrirla. ' +
          'Si sigue igual, comprueba en GitHub que están subidos app.js, config.js, styles.css y supabase.js, y envía una captura de esta pantalla.</div>';
      }
    }, 8000);
  </script>

  <script src="supabase.js" defer></script>
  <script src="config.js?v=4.2" defer></script>
  <script src="app.js?v=4.2" defer></script>
</body>
</html>
