<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <title>Hábitos</title>

  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0F172A" />

  <!-- iOS: instalación como app a pantalla completa -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Hábitos" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <!-- ================= VISTA: INICIO (categorías) ================= -->
    <div class="view active" id="view-home">
      <header>
        <h1>Hábitos</h1>
        <button class="icon-btn" id="btn-refresh" aria-label="Actualizar">↻</button>
      </header>
      <div class="sync-badge" id="sync-badge"></div>
      <div class="category-grid" id="category-grid"></div>
    </div>

    <!-- ================= VISTA: ACTIVIDADES DE UNA CATEGORÍA ================= -->
    <div class="view" id="view-activities">
      <header>
        <button class="icon-btn" id="btn-back-home" aria-label="Volver">←</button>
        <h1>&nbsp;</h1>
        <span style="width:42px"></span>
      </header>
      <div class="subheader">
        <div class="cat-pill" id="activities-title"></div>
      </div>
      <div class="activity-list" id="activity-list"></div>
    </div>

    <!-- ================= VISTA: ESTADÍSTICAS ================= -->
    <div class="view" id="view-stats">
      <header>
        <h1>Estadísticas</h1>
        <button class="icon-btn" id="btn-refresh-stats" aria-label="Actualizar">↻</button>
      </header>
      <div class="stats-scroll">
        <div class="period-tabs">
          <button data-period="day" class="active">Hoy</button>
          <button data-period="week">Semana</button>
          <button data-period="month">Mes</button>
        </div>

        <div class="stat-card">
          <h3>Distribución por categoría</h3>
          <canvas id="chart-donut" height="220"></canvas>
          <div class="legend-row" id="donut-legend"></div>
        </div>

        <div class="stat-card">
          <h3 id="totals-title">Totales</h3>
          <div id="totals-list"></div>
        </div>

        <div class="stat-card">
          <h3>Tendencia (últimos 14 días)</h3>
          <canvas id="chart-trend" height="200"></canvas>
        </div>
      </div>
    </div>

    <!-- ================= NAV INFERIOR ================= -->
    <nav class="bottom-nav">
      <button id="nav-home" class="active" data-view="view-home">
        <span class="nav-icon">✅</span>Registrar
      </button>
      <button id="nav-stats" data-view="view-stats">
        <span class="nav-icon">📊</span>Estadísticas
      </button>
    </nav>
  </div>

  <!-- Overlay de confirmación al registrar -->
  <div class="confirm-overlay" id="confirm-overlay">
    <div class="checkmark" id="confirm-checkmark">✓</div>
    <div class="confirm-text" id="confirm-text">Registrado</div>
    <div class="confirm-sub" id="confirm-sub"></div>
  </div>

  <!-- Modal para actividad personalizada -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal-sheet">
      <h3>Actividad personalizada</h3>
      <input type="text" id="custom-input" placeholder="Ej. Organizar el garaje" maxlength="60" />
      <div class="modal-actions">
        <button class="btn-cancel" id="btn-cancel-custom">Cancelar</button>
        <button class="btn-save" id="btn-save-custom">Registrar</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
