<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <title>Hábitos</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#F2F4F7" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#090C12" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Hábitos" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="stylesheet" href="styles.css?v=4.0" />
</head>
<body>
  <div class="shell">
    <nav class="tabbar" id="tabbar" aria-label="Secciones"></nav>
    <main class="main" id="main"></main>
  </div>
  <div id="layer"></div>

  <!-- Aviso de emergencia independiente del resto de archivos -->
  <script>
    setTimeout(function () {
      var m = document.getElementById('main');
      if (m && m.children.length === 0) {
        m.innerHTML = '<div style="margin:24px 0;padding:16px;border-radius:14px;background:#FDECEC;color:#8A1C1C;font:14px -apple-system,sans-serif">' +
          '<b>La app no terminó de cargar.</b><br><br>Cierra la app por completo y vuelve a abrirla. ' +
          'Si sigue igual, comprueba en GitHub que están subidos app.js, config.js, styles.css y supabase.js, y envía una captura de esta pantalla.</div>';
      }
    }, 8000);
  </script>

  <script src="supabase.js" defer></script>
  <script src="config.js?v=4.0" defer></script>
  <script src="app.js?v=4.0" defer></script>
</body>
</html>
